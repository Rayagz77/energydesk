[project]
name = "energydesk-api"
version = "0.1.0"
description = "API REST EnergyDesk - gestion des incidents techniques de comptage (donnees fictives)"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
# E/F : erreurs classiques, I : tri des imports, B : bugs probables,
# S : regles de securite (equivalent Bandit), UP : syntaxe Python moderne.
select = ["E", "F", "I", "B", "S", "UP"]
ignore = ["B008"]  # Depends() dans les signatures FastAPI est le style attendu

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]  # assert et mots de passe factices autorises dans les tests
"alembic/**" = ["E501"]
