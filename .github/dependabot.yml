# Mises a jour automatiques proposees par pull request (gestion des vulnerabilites, ISO 27001 A.8.8).
# Frequence mensuelle et mises a jour regroupees pour limiter le bruit.
version: 2
updates:
  - package-ecosystem: pip
    directories: ["/backend", "/worker"]
    schedule: { interval: monthly }
    groups:
      python-deps: { patterns: ["*"] }
  - package-ecosystem: docker
    directories: ["/backend", "/worker", "/frontend"]
    schedule: { interval: monthly }
    ignore:
      - dependency-name: "python"
        versions: [">=3.13"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    groups:
      actions: { patterns: ["*"] }