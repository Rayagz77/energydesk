# Mises a jour automatiques proposees par pull request (gestion des vulnerabilites).
version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule: { interval: weekly }
  - package-ecosystem: pip
    directory: /worker
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directories: ["/backend", "/worker", "/frontend"]
    schedule: { interval: weekly }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
