# Pipeline CI/CD EnergyDesk
# A chaque push : qualite -> tests -> controles de securite -> validation infra -> build et scan des images.
# Sur la branche main uniquement : publication des images sur GHCR puis mise a jour GitOps
# du tag deploye en dev (Argo CD detecte le commit et deploie).
#
# Securite de la chaine (ISO 27001 A.8.25, A.8.28, A.8.7) :
# - permissions minimales par job ; aucun secret externe requis (GITHUB_TOKEN suffit)
# - trivy-action epinglee sur v0.35.0 : seule version non compromise lors de l'attaque de mars 2026
#   (tag protege par les "immutable releases"). Ideal : epingler toutes les actions par SHA de commit.

name: ci

on:
  push:
    branches: ["**"]
    paths-ignore: ["docs/**", "**/*.md"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: Qualite du code (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install ruff==0.17.6
      - name: Lint (erreurs, imports, bugs probables, regles de securite S)
        run: ruff check backend worker
      - name: Format
        run: ruff format --check backend worker

  test-backend:
    name: Tests API (PostgreSQL reel)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: energydesk
          POSTGRES_PASSWORD: test
          POSTGRES_DB: energydesk_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U energydesk" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Pytest
        env:
          DB_HOST: localhost
          DB_PASSWORD: test
        run: pytest --junitxml=pytest-backend.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pytest-backend
          path: backend/pytest-backend.xml

  test-worker:
    name: Tests worker
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: energydesk
          POSTGRES_PASSWORD: test
          POSTGRES_DB: energydesk_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U energydesk" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: worker/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Pytest
        env:
          DB_HOST: localhost
          DB_PASSWORD: test
        run: pytest --junitxml=pytest-worker.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pytest-worker
          path: worker/pytest-worker.xml

  security-scan:
    name: Scan securite du depot (dependances, secrets, configuration)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Trivy - rapport des vulnerabilites HIGH et CRITICAL (non bloquant)
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: CRITICAL,HIGH
          exit-code: "0"
      - name: Trivy - secrets et vulnerabilites CRITICAL corrigeables (bloquant)
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Trivy - mauvaises configurations (Dockerfile, Kubernetes, Terraform) - rapport
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          scan-type: config
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: "0"

  validate-infra:
    name: Validation Helm et Terraform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v4
      - name: Helm lint (chaque environnement)
        run: |
          for env in dev test prod cloud; do
            helm lint deploy/helm/energydesk -f deploy/helm/energydesk/values-$env.yaml --set externalDatabase.host=db.example
          done
      - name: Helm template + kubeconform (validation des manifests Kubernetes)
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz
          for env in dev test prod cloud; do
            helm template energydesk deploy/helm/energydesk -n energydesk-$env \
              -f deploy/helm/energydesk/values-$env.yaml --set externalDatabase.host=db.example > rendered-$env.yaml
            ./kubeconform -strict -summary -ignore-missing-schemas rendered-$env.yaml
          done
      - uses: hashicorp/setup-terraform@v4
      - name: Terraform fmt (rapport ; corriger avec "terraform fmt -recursive infra/terraform")
        continue-on-error: true
        run: terraform fmt -check -recursive -diff infra/terraform
      - name: Terraform validate (local et cloud)
        run: |
          for dir in infra/terraform/local infra/terraform/cloud; do
            terraform -chdir=$dir init -backend=false -input=false
            terraform -chdir=$dir validate
          done

  build:
    name: Image ${{ matrix.component }}
    needs: [lint, test-backend, test-worker, security-scan, validate-infra]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: api
            context: backend
          - component: worker
            context: worker
          - component: frontend
            context: frontend
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
      - name: Calcul des tags (version + SHA, jamais "latest" seul)
        id: meta
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          VERSION="$(cat VERSION)"
          SHORT_SHA="${GITHUB_SHA::7}"
          IMAGE="ghcr.io/${OWNER}/energydesk-${{ matrix.component }}"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "tag=${VERSION}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "Image : ${IMAGE}:${VERSION}-${SHORT_SHA}"
      - uses: docker/setup-buildx-action@v3
      - name: Build (charge localement pour le scan)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          load: true
          tags: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
      - name: Taille de l'image (mesure FinOps)
        run: docker image ls ${{ steps.meta.outputs.image }} --format "{{.Repository}}:{{.Tag}} {{.Size}}"
      - name: Trivy - scan de l'image (bloquant sur CRITICAL corrigeable)
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Connexion a GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publication (main uniquement)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          VERSION="$(cat VERSION)"
          docker tag "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}" "${{ steps.meta.outputs.image }}:${VERSION}"
          docker push "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}"
          docker push "${{ steps.meta.outputs.image }}:${VERSION}"

  gitops-update-dev:
    name: GitOps - mise a jour du tag deploye en dev
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Ecrire le nouveau tag dans values-dev.yaml
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          TAG="${{ needs.build.outputs.tag }}"
          FILE=deploy/helm/energydesk/values-dev.yaml
          sed -i -E "s|^(  owner: ).*|\1${OWNER}|; s|^(  tag: ).*|\1\"${TAG}\"   # ecrit par la CI|" "$FILE"
          git diff --stat
      - name: Commit et push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/helm/energydesk/values-dev.yaml
          git diff --cached --quiet && { echo "Rien a changer"; exit 0; }
          git commit -m "deploy(dev): energydesk ${{ needs.build.outputs.tag }}"
          git push
