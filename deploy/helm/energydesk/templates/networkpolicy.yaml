{{- if .Values.networkPolicy.enabled }}
{{- $fullname := include "ed.fullname" . -}}
# Cloisonnement reseau : les services de donnees n'acceptent que l'API, le worker et la sauvegarde.
# Effectif uniquement si le CNI du cluster applique les NetworkPolicies.
{{- range $component, $port := dict "postgres" 5432 "rabbitmq" 5672 "minio" 9000 }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}-{{ $component }}
  labels:
    {{- include "ed.labels" $ | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "ed.selector" (dict "ctx" $ "component" $component) | nindent 6 }}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/component
                operator: In
                values: ["api", "worker", "backup"]
      ports:
        - port: {{ $port }}
    # Prometheus (namespace monitoring) peut lire les metriques RabbitMQ.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
{{- end }}
{{- end }}
