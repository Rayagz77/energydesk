{{- if .Values.ingress.enabled }}
# Point d'entree HTTP(S) unique : /api -> API, tout le reste -> front-end.
# /metrics et /health ne sont PAS exposes : ils restent internes au cluster.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "ed.fullname" . }}
  labels:
    {{- include "ed.labels" . | nindent 4 }}
  annotations:
    {{- if .Values.ingress.tls.enabled }}
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    {{- end }}
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts: [{{ .Values.ingress.host | quote }}]
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "ed.fullname" . }}-api
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "ed.fullname" . }}-frontend
                port:
                  name: http
{{- end }}
