# Compte de service de l'application : aucun droit sur l'API Kubernetes
# et pas de jeton monte dans les pods (moindre privilege, ISO 27001 A.8.2).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "ed.fullname" . }}-app
  labels:
    {{- include "ed.labels" . | nindent 4 }}
automountServiceAccountToken: false
