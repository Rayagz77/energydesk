# RBAC Kubernetes : role en LECTURE SEULE sur le namespace, attribue a un groupe.
# Verification :
#   kubectl auth can-i list pods      -n <ns> --as=lea --as-group={{ .Values.rbac.viewerGroup }}   -> yes
#   kubectl auth can-i delete pods    -n <ns> --as=lea --as-group={{ .Values.rbac.viewerGroup }}   -> no
#   kubectl auth can-i get secrets    -n <ns> --as=lea --as-group={{ .Values.rbac.viewerGroup }}   -> no
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "ed.fullname" . }}-viewer
  labels:
    {{- include "ed.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "services", "configmaps", "persistentvolumeclaims", "events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "ed.fullname" . }}-viewer
  labels:
    {{- include "ed.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "ed.fullname" . }}-viewer
subjects:
  - kind: Group
    apiGroup: rbac.authorization.k8s.io
    name: {{ .Values.rbac.viewerGroup }}
