{{- $name := printf "%s-api" (include "ed.fullname" .) -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "ed.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  {{- if not .Values.api.hpa.enabled }}
  replicas: {{ .Values.api.replicas }}
  {{- end }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: {{ .Values.rollingUpdate.maxSurge }}
      maxUnavailable: {{ .Values.rollingUpdate.maxUnavailable }}
  selector:
    matchLabels:
      {{- include "ed.selector" (dict "ctx" . "component" "api") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ed.selector" (dict "ctx" . "component" "api") | nindent 8 }}
        app.kubernetes.io/version: {{ .Values.image.tag | quote }}
      annotations:
        {{- include "ed.configChecksum" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "ed.fullname" . }}-app
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
        runAsUser: 10001
        runAsGroup: 10001
      # Les migrations Alembic s'executent avant le demarrage de l'API.
      # Un verrou PostgreSQL empeche deux pods de migrer en meme temps.
      initContainers:
        - name: migrate
          image: {{ include "ed.image" (dict "ctx" . "component" "api") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef:
                name: {{ include "ed.fullname" . }}-config
          env:
            {{- include "ed.secretEnv" (dict "ctx" . "name" "DB_PASSWORD") | nindent 12 }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
      containers:
        - name: api
          image: {{ include "ed.image" (dict "ctx" . "component" "api") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: {{ include "ed.fullname" . }}-config
          env:
            {{- include "ed.secretEnv" (dict "ctx" . "name" "DB_PASSWORD") | nindent 12 }}
            {{- include "ed.secretEnv" (dict "ctx" . "name" "JWT_SECRET_KEY") | nindent 12 }}
            {{- include "ed.secretEnv" (dict "ctx" . "name" "S3_ACCESS_KEY") | nindent 12 }}
            {{- include "ed.secretEnv" (dict "ctx" . "name" "S3_SECRET_KEY") | nindent 12 }}
            {{- include "ed.secretEnv" (dict "ctx" . "name" "RABBITMQ_PASSWORD") | nindent 12 }}
          # startup : laisse le temps au demarrage ; readiness : retire le pod du Service si la base
          # ne repond plus ; liveness : redemarre le conteneur s'il est bloque.
          startupProbe:
            httpGet: { path: /health/live, port: http }
            periodSeconds: 3
            failureThreshold: 20
          readinessProbe:
            httpGet: { path: /health/ready, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /health/live, port: http }
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "ed.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  selector:
    {{- include "ed.selector" (dict "ctx" . "component" "api") | nindent 4 }}
  ports:
    - name: http
      port: 8000
      targetPort: http
{{- if .Values.api.hpa.enabled }}
---
# Autoscaling horizontal : Kubernetes ajoute des pods quand l'utilisation CPU moyenne
# depasse la cible (en % des requests CPU). Necessite metrics-server.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ $name }}
  labels:
    {{- include "ed.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ $name }}
  minReplicas: {{ .Values.api.hpa.minReplicas }}
  maxReplicas: {{ .Values.api.hpa.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.api.hpa.targetCPUUtilizationPercentage }}
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 60   # 60 s au lieu de 300 s : demonstration plus rapide
{{- end }}
