# Argo CD allege pour un cluster de demonstration.
configs:
  params:
    server.insecure: true        # TLS gere par le port-forward local ; ne pas faire en production exposee
dex:
  enabled: false
notifications:
  enabled: false
applicationSet:
  replicas: 1
controller:
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 768Mi }
repoServer:
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 512Mi }
server:
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { memory: 256Mi }
redis:
  resources:
    requests: { cpu: 20m, memory: 32Mi }
    limits: { memory: 128Mi }
